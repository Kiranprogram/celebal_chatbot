worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 50m;

    # Docker embedded DNS — re-resolve service names (avoids stale IP → 502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        location /api/auth/ {
            set $auth_upstream auth-service;
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://$auth_upstream:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /api/orchestrator/ {
            set $orch_upstream orchestrator-service;
            rewrite ^/api/orchestrator/(.*)$ /$1 break;
            proxy_pass http://$orch_upstream:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
        }

        location /api/knowledge/ {
            set $know_upstream knowledge-service;
            rewrite ^/api/knowledge/(.*)$ /$1 break;
            proxy_pass http://$know_upstream:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            client_max_body_size 50m;
        }

        location /api/memory/ {
            set $mem_upstream memory-service;
            rewrite ^/api/memory/(.*)$ /$1 break;
            proxy_pass http://$mem_upstream:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            set $fe_upstream frontend;
            proxy_pass http://$fe_upstream:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
