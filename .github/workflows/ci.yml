name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-lint-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python services exist
        run: |
          test -f services/auth-service/app/main.py
          test -f services/orchestrator-service/app/main.py
          test -f services/knowledge-service/app/main.py
          test -f services/memory-service/app/main.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: /api
